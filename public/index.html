<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- No `viewport-fit=cover`: that would let the app draw its own content under the iOS
         status bar/notch/Dynamic Island, which is exactly what triggers iOS's translucent
         scroll-edge scrim (a light-to-dark gradient) over that area — independent of the
         `apple-mobile-web-app-status-bar-style` value below. Without `cover`, Safari confines
         the viewport to the safe area itself, so there's nothing to scrim: the status bar
         becomes a plain solid bar (styled via that meta) and app content simply starts below
         it. `env(safe-area-inset-*)` (`react-native-safe-area-context` on web) reports 0 on
         every edge as a result — correct here, since nothing draws into an unsafe area.
         `maximum-scale=1, user-scalable=no` disable pinch/double-tap zoom — zooming can leave the
         page's visual viewport out of sync with its `100dvh` layout, showing a white bar at the
         bottom of the screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Solide dunkle Statusleiste (kein `-translucent` — siehe viewport-Kommentar oben,
         warum `cover` weg ist) — passt fast nahtlos zu colors.background (#0B0F0C). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="kickflow" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height. `100dvh` tracks iOS Safari's collapsible
         address/tab bar so the layout never extends past what's actually visible — without it,
         a fixed `100%` is measured against the largest (toolbar-hidden) viewport, and content
         anchored to the bottom (e.g. a tab bar) ends up hidden below the visible area. */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      /* These styles disable body scrolling if you are using <ScrollView>, and stop iOS from
         rubber-banding the whole page (which would otherwise shift the fixed nav/tab bar frame). */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Belt-and-suspenders zoom lock alongside the viewport meta tag above: `touch-action` blocks
         pinch-zoom gestures, and `text-size-adjust` stops Safari from auto-zooming text. */
      html,
      body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script src="/register-sw.js"></script>
  </body>
</html>
