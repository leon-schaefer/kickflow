<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- KEIN `viewport-fit=cover`. Die App zeichnet absichtlich NICHT unter Statusleiste
         und Home-Indicator, sondern nur in den sicheren Bereich, den iOS ihr gibt.

         Das war zweimal andersherum und beide Male falsch. Randlos legt iOS in der
         installierten PWA eine eigene, gerasterte Schicht über den oberen Rand — am
         Screenshot ausgemessen: von der Bildschirmkante bis 101pt hinunter, mit HARTER
         Unterkante, und alles darin verschmiert (der Liga-Titel kam auf Spitzenhelligkeit
         151 statt der 245, die Text in derselben Farbe 30pt tiefer erreicht). Das Band reicht
         rund 40pt WEITER als `env(safe-area-inset-top)` (~62pt) — das Inset zu respektieren
         genügt also nicht.
         Gegen eine Schicht des Systems hilft kein CSS; hilft nur, nichts darunter zu malen.
         Das geht in zwei Schritten, und beide sind nötig: hier oben bleibt die App aus dem
         Bereich unter der Statusleiste heraus, womit der Viewport bei ~62pt beginnt. Die
         restlichen ~40pt des Bandes liegen dann IM Viewport — so weit von der Viewport-Kante
         weg fängt der Inhalt der Kopfzeile in der installierten PWA deshalb frühestens an
         (src/shell/AppHeader.module.css, Wert als `iosTopClearance` in src/theme/tokens.ts —
         diese 40pt sind darin das Pflicht-Minimum, gesetzt ist etwas mehr).

         Ohne `viewport-fit=cover` melden alle `env(safe-area-inset-*)` null. Das ist hier
         kein Verlust, sondern der Sinn der Sache: der sichere Bereich IST jetzt der
         Viewport, die `max()`-Ausdrücke in AppHeader und TabBar fallen auf ihre
         Design-Werte zurück und stimmen damit. Die Streifen oben und unten malt iOS aus dem
         html/body-`background-color` weiter unten — der ist deshalb doppelt tragend.

         `maximum-scale=1, user-scalable=no` sperrt Pinch- und Doppeltipp-Zoom: Zoom bringt
         den Visual Viewport und das `100dvh`-Layout auseinander, sichtbar als weißer Balken
         unten. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <!-- Länger als der reine Produktname, seit die Startseite öffentlich ist: dieser Text
         ist die Überschrift im Suchergebnis und der Fallback jedes Scrapers, der kein
         `og:title` liest. Auf der App-Oberfläche taucht er nicht auf — in der installierten
         PWA kommt der Name aus dem Manifest bzw. aus `apple-mobile-web-app-title`. -->
    <title>kickflow – Aufstellungs-Optimizer für deine Kickbase-Liga</title>
    <!-- theme-color und das Favicon injizierte bisher die Expo-CLI aus app.json
         (`web.themeColor` / `web.favicon`). Die Datei ist mit dem Umzug auf Vite weg,
         beide Angaben stehen deshalb hier. -->
    <meta name="theme-color" content="#0B0F0C" />
    <!--
      SVG zuerst, PNG als Rückfall. Browser nehmen das erste Format, das sie
      kennen; das SVG skaliert scharf auf jede Tab-, Lesezeichen- und
      Verlaufs-Größe, während die 196px-PNG auf einem hochauflösenden Display
      weichgezeichnet wird. Die PNG bleibt für alles, was SVG-Favicons nicht
      kennt (Safari < 16, ältere Android-Browser).
      Beide erzeugt scripts/generate-icons.py aus derselben Geometrie.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `black`, NICHT `black-translucent` — und nur zusammen mit dem fehlenden
         `viewport-fit=cover` oben zu lesen: `black-translucent` zwingt den Inhalt unter die
         Statusleiste, egal was der Viewport sagt, und genau dort liegt die Schicht, die ihn
         verschmiert. `black` lässt iOS eine deckende Leiste zeichnen, unter der der Content
         erst anfängt.

         `black-translucent` stand hier, weil es der einzige Wert ist, der
         `env(safe-area-inset-top)` überhaupt einen Wert melden lässt. Das stimmt — es war
         nur die falsche Frage: der Titel saß danach nachweislich UNTER dem Inset und war
         trotzdem verschmiert, weil das Band tiefer reicht als die Safe Area. Wer hierauf
         zurückgeht, holt sich das Schmieren zurück, ohne dass der Desktop-Browser ein
         Symptom zeigt. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="kickflow" />

    <!-- Vorschaukarte und Suchergebnis.

         Der Weg, auf dem kickflow Nutzer findet, ist der Link in einem Liga-Gruppenchat.
         Ohne diese Tags rendert WhatsApp, Discord, Signal oder Reddit dafür eine graue
         Karte ohne Bild und ohne Satz — die App sieht im Moment der Empfehlung kaputt aus,
         und zwar an der einzigen Stelle, an der ein Browser nichts davon merkt.

         `%SITE_ORIGIN%` ersetzt ein Plugin in vite.config.ts zur Build-Zeit (Herleitung in
         scripts/siteOrigin.ts). Die URLs MÜSSEN absolut sein: Open Graph verlangt es, und
         die Scraper lösen einen relativen Pfad nicht zuverlässig auf.

         Das Bild liegt als public/og-image.png im Repo und entsteht aus derselben
         Vektor-Marke wie die Icons (scripts/generate-icons.py). 1200x630 ist das Format der
         grossen Karte; die Angabe von width/height erspart dem Scraper einen zweiten
         Abruf, bevor er die Karte layoutet. -->
    <meta name="description" content="Inoffizieller Begleiter für Kickbase: beste Elf je Formation, Pflichtverkäufe fürs Konto, liga-eigene Regeln, Marktwerte und Restprogramm. Kostenlos im Browser." />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="kickflow" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="kickflow – Aufstellungs-Optimizer für deine Kickbase-Liga" />
    <meta property="og:description" content="Beste Elf je Formation, Pflichtverkäufe fürs Konto, liga-eigene Regeln — kostenlos im Browser, ohne Installation." />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Die Wortmarke kickflow über einer steigenden Marktwert-Kurve, die als Fußball ausläuft." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="kickflow – Aufstellungs-Optimizer für deine Kickbase-Liga" />
    <meta name="twitter:description" content="Beste Elf je Formation, Pflichtverkäufe fürs Konto, liga-eigene Regeln — kostenlos im Browser, ohne Installation." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.png" />
    <!-- Nur die Handvoll Regeln, die kein CSS-Modul tragen kann, weil sie html/body/#root
         betreffen. Alles andere liegt in src/theme/. Bewacht von
         src/updates/indexHtml.test.ts — jede Regel hier hat einen Grund, und alle drei
         brechen stumm. -->
    <style id="app-reset">
      /* These styles make the body full-height. `100dvh` tracks iOS Safari's collapsible
         address/tab bar so the layout never extends past what's actually visible — without it,
         a fixed `100%` is measured against the largest (toolbar-hidden) viewport, and content
         anchored to the bottom (e.g. a tab bar) ends up hidden below the visible area.
         `background-color` matches `colors.background` (src/theme/tokens.ts) — without it,
         `html`/`body` default to white, which Safari's own top/bottom toolbar tinting samples
         from directly (the `theme-color` meta tag alone isn't enough).
         Seit die App nicht mehr randlos zeichnet (kein `viewport-fit=cover`, siehe oben)
         trägt diese Farbe mehr als ein kurzes Aufblitzen: die Streifen unter Statusleiste
         und Home-Indicator gehören jetzt dauerhaft iOS, und iOS füllt sie aus genau diesem
         Wert. Steht er falsch, rahmt ein heller Balken die App — auf dem Desktop unsichtbar. */
      html,
      body {
        height: 100%;
        height: 100dvh;
        background-color: #0B0F0C;
      }
      /* Die App scrollt in ihren eigenen Containern (src/theme/layout.module.css `.scroller`),
         nie im Body. Das stoppt außerdem iOS' Rubber-Banding, das sonst den festen
         Header/Tab-Bar-Rahmen verschieben würde. */
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Belt-and-suspenders zoom lock alongside the viewport meta tag above: `touch-action` blocks
         pinch-zoom gestures, and `text-size-adjust` stops Safari from auto-zooming text. */
      html,
      body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Der einzige Text, den ein Crawler ohne JavaScript-Ausführung im Body findet — die
         Startseite selbst rendert React. Deshalb steht hier nicht nur der Hinweis, sondern
         auch, worum es geht. -->
    <noscript>
      <h1>kickflow</h1>
      <p>
        Aufstellungs-Optimizer für deine Kickbase-Liga: beste Elf je Formation,
        Pflichtverkäufe zum Ausgleich des Kontos, liga-eigene Regeln, Marktwerte und
        Restprogramm. Inoffiziell, kostenlos, läuft im Browser.
      </p>
      <p>Zum Benutzen muss JavaScript aktiviert sein.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Registriert den Service Worker und pollt /build-id.txt, um ein offen gebliebenes
         PWA-Tab auf einen Redeploy hinzuweisen. Classic Script, kein Modul — und die Datei
         darf nicht umziehen, src/updates/registerSw.test.ts liest sie von der Platte. -->
    <script src="/register-sw.js"></script>
  </body>
</html>
