<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- `viewport-fit=cover` lets the app draw under the iOS status bar/notch and home
         indicator, which is what makes `env(safe-area-inset-*)` report non-zero values on
         web (e.g. the bottom tab bar padding above the home indicator, see
         src/shell/TabBar.module.css). Dropping it once broke that bottom inset — keep it,
         and rely on `apple-mobile-web-app-status-bar-style=black` below (non-translucent)
         so the status bar renders as a solid opaque bar instead of the scrim/gradient a
         translucent style draws over edge-to-edge content.
         `maximum-scale=1, user-scalable=no` disable pinch/double-tap zoom — zooming can leave the
         page's visual viewport out of sync with its `100dvh` layout, showing a white bar at the
         bottom of the screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>kickflow</title>
    <!-- theme-color und das Favicon injizierte bisher die Expo-CLI aus app.json
         (`web.themeColor` / `web.favicon`). Die Datei ist mit dem Umzug auf Vite weg,
         beide Angaben stehen deshalb hier. -->
    <meta name="theme-color" content="#0B0F0C" />
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `black` statt `black-translucent`: eine solide Statusleiste, kein Scrim/Gradient
         über dem Content — passt fast nahtlos zu colors.background (#0B0F0C). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="kickflow" />
    <!-- Nur die Handvoll Regeln, die kein CSS-Modul tragen kann, weil sie html/body/#root
         betreffen. Alles andere liegt in src/theme/. Bewacht von
         src/updates/indexHtml.test.ts — jede Regel hier hat einen Grund, und alle drei
         brechen stumm. -->
    <style id="app-reset">
      /* These styles make the body full-height. `100dvh` tracks iOS Safari's collapsible
         address/tab bar so the layout never extends past what's actually visible — without it,
         a fixed `100%` is measured against the largest (toolbar-hidden) viewport, and content
         anchored to the bottom (e.g. a tab bar) ends up hidden below the visible area.
         `background-color` matches `colors.background` (src/theme/tokens.ts) — without it,
         `html`/`body` default to white, which Safari's own top/bottom toolbar tinting samples
         from directly (the `theme-color` meta tag alone isn't enough), and which briefly
         flashes in the safe-area edges before the React root paints its own dark background. */
      html,
      body {
        height: 100%;
        height: 100dvh;
        background-color: #0B0F0C;
      }
      /* Die App scrollt in ihren eigenen Containern (src/theme/layout.module.css `.scroller`),
         nie im Body. Das stoppt außerdem iOS' Rubber-Banding, das sonst den festen
         Header/Tab-Bar-Rahmen verschieben würde. */
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Belt-and-suspenders zoom lock alongside the viewport meta tag above: `touch-action` blocks
         pinch-zoom gestures, and `text-size-adjust` stops Safari from auto-zooming text. */
      html,
      body {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Diese App braucht JavaScript.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Registriert den Service Worker und pollt /build-id.txt, um ein offen gebliebenes
         PWA-Tab auf einen Redeploy hinzuweisen. Classic Script, kein Modul — und die Datei
         darf nicht umziehen, src/updates/registerSw.test.ts liest sie von der Platte. -->
    <script src="/register-sw.js"></script>
  </body>
</html>
