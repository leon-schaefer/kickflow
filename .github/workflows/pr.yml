# Checks für Pull Requests. Bewusst getrennt von release.yml: dort hängt alles
# am push-Trigger und darf veröffentlichen, hier wird nur geprüft und berichtet.
# Kein eas update, kein eas build, keine Submission.
#
# Der Fingerprint-Report ist der eigentliche Grund für diesen Workflow. Ob ein
# Merge als OTA rausgeht oder einen Build nach sich zieht, entscheidet der
# runtimeVersion-Fingerprint — und das sah man bisher erst, wenn release.yml
# nach dem Merge schon lief. Eine Zeile in eas.json oder eine neue Dependency
# mit native code macht aus einem Sekunden-OTA einen Store-Build, das gehört
# vor den Merge sichtbar.
#
# Grenze des Reports: verglichen wird gegen den letzten fertigen Build auf dem
# Kanal, also gegen EAS — nicht gegen das, was bei Apple oder Google liegt.
# Beides kann auseinanderlaufen, wenn ein Build fertig wird und seine
# Submission scheitert (so passiert mit Build 14). "OTA möglich" heißt dann
# zwar korrekt, dass die runtimeVersion zum letzten Build passt, aber nicht,
# dass jemand sie anfragt. Der Kommentar sagt das mit.
#
# iOS und Android werden getrennt bewertet, der Kommentar kann deshalb beides
# zugleich melden: OTA für die eine, Build für die andere Plattform.
#
# actions/checkout prüft bei pull_request den Merge-Commit aus, der Report gilt
# also für das, was tatsächlich landen würde — nicht für den Branch-Kopf.
#
# Ohne EXPO_TOKEN (Forks bekommen keine Secrets) laufen Typecheck und Tests
# weiter, nur der Report entfällt. Kein Fehlschlag: ein Fork kann daran nichts
# ändern.

name: PR

on:
  pull_request:
    branches:
      - develop
      - main

# Bei PRs ist Abbrechen richtig — ein überholter Lauf prüft alten Code.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Typecheck, Tests, Fingerprint
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm ci, nicht npm install: der Fingerprint hängt am exakten
      # Dependency-Baum, und nur ci reproduziert den aus dem Lockfile.
      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Expo und EAS einrichten
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Ziel bestimmen
        if: env.EXPO_TOKEN != ''
        id: target
        run: |
          case "${{ github.base_ref }}" in
            develop) channel=testflight ;;
            main)    channel=production ;;
            *)       echo "::error::Kein Release-Ziel für Base-Branch ${{ github.base_ref }}"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: OTA möglich?
        if: env.EXPO_TOKEN != ''
        id: check
        run: npx tsx scripts/check-fingerprint.ts --channel "${{ steps.target.outputs.channel }}" --report-only

      # Ein Kommentar statt nur Step-Summary, damit die Antwort im PR steht und
      # nicht im Checks-Tab. --edit-last hält es bei einem Kommentar; beim
      # ersten Lauf gibt es keinen zu bearbeiten, dann greift das Fallback.
      - name: Ergebnis in den PR schreiben
        if: env.EXPO_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          CHANNEL: ${{ steps.target.outputs.channel }}
          OTA: ${{ steps.check.outputs.ota-possible }}
          PLATFORM: ${{ steps.check.outputs.build-platform }}
        run: |
          # Beide Zeilen können zugleich zutreffen: passt der Fingerprint auf
          # einer Plattform und fehlt auf der anderen das Binary, publiziert
          # release.yml ein OTA *und* startet einen Build.
          : > body.md
          if [ "$OTA" = "true" ]; then
            cat >> body.md <<EOF
          **Merge geht als OTA-Update raus** — Kanal \`$CHANNEL\`.

          Der Fingerprint entspricht dem letzten fertigen Build auf dem Kanal.
          Verglichen wird gegen EAS, nicht gegen den Store: liegt dieser Build
          nicht in TestFlight bzw. im Play-Track oder App Store, erreicht das
          Update niemanden.

          EOF
          fi
          if [ -n "$PLATFORM" ]; then
            cat >> body.md <<EOF
          **Merge löst einen Build aus** — Plattform \`$PLATFORM\`, Kanal \`$CHANNEL\`.

          Für diese Plattform weicht der Fingerprint vom letzten Build auf dem
          Kanal ab (native Dependency, Config-Plugin, app.json oder eas.json
          geändert) oder es gibt dort noch gar kein Binary. Ein OTA könnte
          nichts Installiertes erreichen, deshalb baut release.yml nach dem
          Merge neu und lädt an App Store Connect bzw. die Play Console hoch.

          EOF
          fi
          if [ ! -s body.md ]; then
            cat >> body.md <<EOF
          **Merge veröffentlicht nichts** — Kanal \`$CHANNEL\`.

          Für jede Plattform läuft für diesen Stand bereits ein Build. Ein
          zweiter kostete nur eine Buildnummer.
          EOF
          fi
          {
            echo '<!-- fingerprint-report -->'
            cat body.md
          } > comment.md
          gh pr comment "$PR" --edit-last --body-file comment.md \
            || gh pr comment "$PR" --body-file comment.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fingerprint-Report übersprungen
        if: env.EXPO_TOKEN == ''
        run: echo "Kein EXPO_TOKEN verfügbar (Fork?) — Typecheck und Tests sind gelaufen, der Fingerprint-Report entfällt." >> "$GITHUB_STEP_SUMMARY"
