# QR-Code zum Vercel-Preview in den PR.
#
# Der Grund: die Web-Version auf einem echten Handy anzusehen heißt sonst,
# eine Vercel-URL mit Hash abzutippen. Ein QR-Code im PR-Kommentar macht aus
# dem Review-Schritt "einmal scannen".
#
# Zwei Trigger, weil ein Trigger allein Lücken lässt:
#
#   deployment_status — der eigentliche Fall. Die Vercel-GitHub-Integration
#   legt für jeden Push ein GitHub-Deployment an und meldet den Status zurück;
#   environment_url trägt dann die Deployment-URL. Feuert also bei jedem neuen
#   Deployment, auch beim allerersten direkt nach dem Öffnen des PRs.
#
#   pull_request — der Nachzügler. Wird ein Branch gepusht, deployt, und erst
#   danach der PR geöffnet, ist das deployment_status-Event längst durch und
#   der frische PR bliebe ohne Kommentar. Hier wird deshalb das letzte
#   erfolgreiche Deployment zum Head-Commit nachgeschlagen. Steht noch keins
#   (Normalfall beim Öffnen: Vercel baut noch), passiert nichts — kein
#   Fehlschlag, das deployment_status-Event holt es Sekunden später nach.
#
# Beide Pfade laufen aus der Fassung des jeweiligen Branches: GitHub nimmt
# beim deployment_status-Event den ref des Deployments, nicht den
# Default-Branch. Änderungen an dieser Datei wirken also schon im PR.
#
# Gefiltert wird auf offene PRs gegen develop und main. Ein Production-Deploy
# nach dem Merge trifft nur noch geschlossene PRs und fällt damit raus.
#
# Der QR-Code selbst wird von api.qrserver.com gerendert. GitHub erlaubt in
# Kommentaren keine Inline-SVGs und keine data:-URIs — ein externer Renderer
# ist damit der Weg, der ohne Extra-Infrastruktur funktioniert. Die
# Deployment-URL steht dabei in der Query der Bild-URL, geht also an diesen
# Dienst.
#
# Auf einem privaten Repo war er der EINZIGE Weg (raw.githubusercontent
# scheidet dort aus, Camo kommt ohne Token nicht dran). Seit das Repo
# öffentlich ist, wäre ein ins Repo gelegtes PNG eine Alternative — nur
# müsste man es pro Preview-URL erst erzeugen und einchecken. Solange der
# Tausch so aussieht, bleibt der Renderer. Preisgegeben wird ohnehin nichts,
# was der Kommentar nicht selbst öffentlich hinschreibt: die Preview-URL
# steht im PR-Thread, und der ist auf einem öffentlichen Repo für jeden
# lesbar.

name: Vercel QR

on:
  deployment_status:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
      - main

# Pro Branch serialisieren und Überholte abbrechen: relevant ist immer nur das
# neueste Deployment, und parallele Läufe würden sich beim Bearbeiten des
# Kommentars in die Quere kommen.
concurrency:
  group: vercel-qr-${{ github.event.deployment.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# deployments: read braucht der pull_request-Pfad, um das letzte
# erfolgreiche Deployment zum Head-Commit nachzuschlagen — ohne das
# antwortet /repos/.../deployments mit 403.
permissions:
  contents: read
  deployments: read
  pull-requests: write

jobs:
  comment:
    name: QR-Code kommentieren
    # Zwei Bedingungen, beide nötig:
    #
    # 1. Bei deployment_status nur der Erfolgsfall mit URL; die pending- und
    #    in_progress-Meldungen tragen noch keine.
    # 2. Nur Pull Requests aus DIESEM Repo. Bei einem PR aus einem Fork ist
    #    der GITHUB_TOKEN read-only, `pull-requests: write` unten wird also
    #    nicht gewährt — der Kommentar-Aufruf scheitert mit 403 und der
    #    fremde Beitrag bekommt ein rotes Kreuz für etwas, das nichts mit
    #    seinem Code zu tun hat. Übersprungen ist hier richtig, und es geht
    #    nichts verloren: Vercel deployt Forks ohnehin nicht von selbst, es
    #    gibt also gar keine Preview-URL zu verlinken. Die Bedingung ist
    #    gegen das REPO formuliert, nicht gegen `fork` — ein Branch im
    #    eigenen Repo bleibt damit abgedeckt, auch wenn er aus einem Fork
    #    heraus entstanden ist.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment_status.environment_url != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- vercel-qr -->';
            const BASES = ['develop', 'main'];
            const { owner, repo } = context.repo;

            // Letztes erfolgreiches Deployment zu einem Commit. Nur für den
            // pull_request-Pfad — beim deployment_status-Event steht alles
            // schon im Payload.
            async function lookupDeployment(sha) {
              let deployments;
              try {
                deployments = await github.rest.repos.listDeployments({
                  owner, repo, sha, per_page: 20,
                });
              } catch (error) {
                // Fork-PRs bekommen ein read-only Token ohne deployments-Scope.
                // Kein Grund, den Lauf rot zu machen — das deployment_status-
                // Event läuft im Kontext des Base-Repos und kommt trotzdem.
                core.info(`Deployments zu ${sha.slice(0, 7)} nicht lesbar (${error.status || error.message}).`);
                return null;
              }
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 100,
                });
                const ok = statuses.data.find(
                  (s) => s.state === 'success' && s.environment_url,
                );
                if (ok) {
                  return {
                    url: ok.environment_url,
                    environment: ok.environment || deployment.environment,
                  };
                }
              }
              return null;
            }

            // Welcher Commit, welche URL, welche PRs?
            let sha, url, environment, pullNumbers;

            if (context.eventName === 'deployment_status') {
              sha = context.payload.deployment.sha;
              url = context.payload.deployment_status.environment_url;
              environment =
                context.payload.deployment_status.environment ||
                context.payload.deployment.environment;

              const associated =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner, repo, commit_sha: sha, per_page: 100,
                });
              pullNumbers = associated.data
                .filter((pr) => pr.state === 'open' && BASES.includes(pr.base.ref))
                .map((pr) => pr.number);
            } else {
              const pr = context.payload.pull_request;
              sha = pr.head.sha;
              pullNumbers = [pr.number];

              const found = await lookupDeployment(sha);
              if (!found) {
                core.info(
                  `Noch kein erfolgreiches Deployment zu ${sha.slice(0, 7)} — ` +
                  'das deployment_status-Event übernimmt, sobald Vercel fertig ist.',
                );
                return;
              }
              url = found.url;
              environment = found.environment;
            }

            if (pullNumbers.length === 0) {
              core.info(`Kein offener PR gegen ${BASES.join(' oder ')} zu ${sha.slice(0, 7)}.`);
              return;
            }

            const qr =
              'https://api.qrserver.com/v1/create-qr-code/' +
              `?size=240x240&margin=10&ecc=M&format=png&data=${encodeURIComponent(url)}`;

            const body = [
              MARKER,
              '### Preview auf dem Handy öffnen',
              '',
              `<img src="${qr}" width="240" height="240" alt="QR-Code zur Deployment-URL" />`,
              '',
              `**[${url}](${url})**`,
              '',
              `Umgebung \`${environment}\` · Commit [\`${sha.slice(0, 7)}\`](https://github.com/${owner}/${repo}/commit/${sha})` +
                ` · Stand ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`,
              '',
              '<sub>Gerendert von api.qrserver.com, die Deployment-URL steht dabei in der Bild-URL. ' +
                'Ist auf dem Vercel-Projekt Deployment Protection aktiv, verlangt der Link auf dem ' +
                'Handy zuerst einen Vercel-Login.</sub>',
            ].join('\n');

            // Ein Kommentar pro PR, bei jedem Deployment aktualisiert:
            // scannen soll man immer das neueste Deployment, nicht in einer
            // Liste danach suchen.
            for (const issue_number of pullNumbers) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              );
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
                core.info(`PR #${issue_number}: Kommentar aktualisiert → ${url}`);
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                });
                core.info(`PR #${issue_number}: Kommentar erstellt → ${url}`);
              }
            }
